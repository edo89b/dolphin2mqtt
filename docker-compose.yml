services:
  dolphin2mqtt:
    build: .
    container_name: dolphin2mqtt
    restart: always
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Internal bridge shared with the broker (reached by name `mqtt`). Pure outbound
      # client: egress to the Dolphin cloud goes out via the host IP (NAT), no LAN IP.
      - mqtt_net

networks:
  mqtt_net:
    external: true
